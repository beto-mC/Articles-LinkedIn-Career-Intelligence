name: Publish audio site

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "site.yml"
      - "assets/**"
      - "tools/audio-site/**"
      - "mC - */**"
      - ".github/workflows/audio-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r tools/audio-site/requirements.txt
      - name: Render the sonic logo
        # From the mC Sonic Constellation export named by sonic_source in site.yml, unless an MP3
        # is committed at sonic_log. If this step fails, the site builds without the sonic logo.
        continue-on-error: true
        run: |
          OUT=$(python -c "import yaml;print(yaml.safe_load(open('site.yml')).get('sonic_log') or '')")
          SRC=$(python -c "import yaml;print(yaml.safe_load(open('site.yml')).get('sonic_source') or '')")
          if [ -z "$OUT" ] || [ -z "$SRC" ] || [ -f "$OUT" ]; then echo "Nothing to render"; exit 0; fi
          npm install --no-save --no-package-lock --silent playwright-core@1
          node tools/audio-site/sonic/render.mjs "$(command -v google-chrome || command -v chromium)" "$SRC" "$OUT"
      - name: Build
        run: python tools/audio-site/build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
