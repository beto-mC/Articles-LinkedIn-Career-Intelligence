name: Publish audio site

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "site.yml"
      - "tools/audio-site/**"
      - "mC - */**"
      - ".github/workflows/audio-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r tools/audio-site/requirements.txt
      - name: Reuse audio already transcoded for unchanged masters
        uses: actions/cache@v4
        with:
          path: _site
          key: audio-${{ hashFiles('**/*.m4a', '**/*.mp3', '**/*.wav', 'site.yml') }}
      - name: Build
        run: python tools/audio-site/build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
