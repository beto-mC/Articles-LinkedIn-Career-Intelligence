thesis:
  eyebrow: The thesis
  heading: "You know the work. Become the conductor."
  lead: "AI Quotient (AIQ) is how well you use AI, check its work, and lead others doing the same."
  body: "Your expertise and judgment are the advantage. AI helps with the parts; you judge the whole."
  steps:
    - {k: Research, h: "Human: define", p: "Define what is useful and relevant. AI finds useful material."}
    - {k: Draft, h: "Human: shape", p: "Set the standard and shape the argument. AI prepares a first version."}
    - {k: Check, h: "Human: judge", p: "Challenge the result and correct it. AI surfaces a result to review."}
  ideas_label: Three ideas behind the thesis
  ideas:
    - {t: "Your experience is the advantage.", p: "AI makes answers easier to get. You still need to know which questions matter, what good work looks like, and when an answer does not make sense."}
    - {t: "More agents do not automatically mean better work.", p: "Give each agent a distinct job. Judge the result after checking and corrections. What is fun, what is productive, and what is monetizable are different."}
    - {t: "Inside an organization, prove one useful improvement.", p: "Get permission. Try one small piece of work. Have someone else check it. Then discuss what the improvement changes for your role—not just your workload."}
  pull: "I did not start with agents. I started with spreadsheets. I turned spreadsheets into tools. Then came Linear, repeatable skills, local models in LM Studio, and now Orca to organize agent work. Each step meant learning—and rework."
  pull_cite: "Beto Cruz · AI Quotient, September 2026"
  closing_line: "Trust, permission, money, and the physical world do not move at software speed."

# Answer-engine block: short, quotable answers taken from the article.
questions:
  - q: What is the AI Quotient (AIQ)?
    a: "AI Quotient (AIQ) is how well you use AI, check its work, and lead others doing the same."
  - q: How do you prove AI's value inside an organization?
    a: "Five gateways, in order: Unit → Sponsor → Baseline → Reviewer → Mandate. Rehearse on permitted work, run one bounded pilot with an independent reviewer, then earn a wider, revocable mandate."
  - q: Do more AI agents mean better work?
    a: "No. Give each agent a distinct job. Judge the result after checking and corrections."
  - q: Who does what when a professional works with AI?
    a: "The human defines what is useful, sets the standard, and challenges the result. AI finds material, prepares a first version, and surfaces a result to review."

